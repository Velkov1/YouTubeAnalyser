<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trending Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav"></div>

    <div class="page">
        <h1>Trending Videos</h1>

        <div class="search-bar">
            <input type="text" id="regionInput" class="text-input" placeholder="Region code, e.g. US">
            <input type="text" id="categoryInput" class="text-input" placeholder="Category ID (optional)">
            <button id="searchButton" class="button">Search</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script src="nav.js"></script>
    <script src="common.js"></script>
    <script src="trending.js"></script>
</body>
</html>
